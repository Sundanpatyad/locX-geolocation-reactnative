buildscript {
  ext {
    kotlinVersion = rootProject.ext.has("kotlinVersion") ? rootProject.ext.get("kotlinVersion") : "2.0.21"
  }
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
  }
}

apply plugin: "com.android.library"
apply plugin: "com.facebook.react"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "org.jetbrains.kotlin.kapt"

def safeExtGet(name, fallback) {
  rootProject.ext.has(name) ? rootProject.ext.get(name) : fallback
}

android {
  namespace "com.locx"
  compileSdk safeExtGet("compileSdkVersion", 35)

  defaultConfig {
    minSdk safeExtGet("minSdkVersion", 23)
    targetSdk safeExtGet("targetSdkVersion", 35)
    consumerProguardFiles "consumer-rules.pro"
    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = "17"
  }

  sourceSets {
    main {
      java.srcDirs += ["${project.buildDir}/generated/source/codegen/java"]
    }
  }

  testOptions {
    unitTests.returnDefaultValues = true
  }
}

react {
  libraryName = "LocXSpec"
  codegenJavaPackageName = "com.locx"
}

dependencies {
  implementation("com.facebook.react:react-android")
  implementation("org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion")
  implementation("com.google.android.gms:play-services-location:21.3.0")
  implementation("androidx.core:core-ktx:1.15.0")
  implementation("androidx.room:room-runtime:2.7.0")
  implementation("androidx.room:room-ktx:2.7.0")
  kapt("androidx.room:room-compiler:2.7.0")
  implementation("androidx.work:work-runtime-ktx:2.10.0")
  implementation("androidx.security:security-crypto:1.1.0-alpha06")

  testImplementation("junit:junit:4.13.2")
  testImplementation("org.json:json:20240303")
}
