<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>locX</title>
    <script>
      (function () {
        var base = '/locX-geolocation-reactnative';
        var path = location.pathname;
        if (path.indexOf(base) === 0) path = path.slice(base.length);
        if (!path) path = '/';
        location.replace(base + '/#' + path + location.search);
      })();
    </script>
  </head>
  <body></body>
</html>
