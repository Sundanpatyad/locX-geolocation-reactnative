<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080a10" />
    <title>locX: background location for React Native</title>
    <meta
      name="description"
      content="react-native-locx is an MIT-licensed background location engine for React Native. Durable SQLite queue, batched uploads, motion detection, odometer, geofencing and headless events on Android and iOS."
    />
    <meta property="og:title" content="locX: background location for React Native" />
    <meta
      property="og:description"
      content="Durable offline queue, batched uploads, motion detection, odometer, geofencing and headless events. Android and iOS, MIT licensed."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" href="/locX-geolocation-reactnative/favicon.svg" type="image/svg+xml" />
    <link
      rel="preload"
      href="/locX-geolocation-reactnative/fonts/Geist-Variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <script>
      (function () {
        var t = null;
        try {
          t = localStorage.getItem('locx-theme');
        } catch (e) {}
        document.documentElement.dataset.theme =
          t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
